name: Keep API warm

# Render's free tier sleeps after 15 idle minutes; a ping every 10 keeps it responsive.
# Scheduled workflows only run from the repository's default branch.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 60 https://onlypain-api.onrender.com/api/health

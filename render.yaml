# Render Blueprint — the API as a free Docker web service (the web app lives on Vercel).
# Dashboard → New → Blueprint → this repo → fill the `sync: false` secrets → Apply.
services:
  - type: web
    name: onlypain-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    branch: v2
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL_COMPANION
        value: claude-opus-5
      - key: AI_MODEL_CLASSIFIER
        value: claude-haiku-4-5
      - key: AI_SAFETY_MODE
        value: full
      - key: ADMIN_EMAILS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PLUS_MONTHLY
        sync: false

# Render Blueprint: one click deploys the API as a web service (long-running, websockets OK)
# and the Next.js app as a second web service. Add secrets in the dashboard after the first sync.
services:
  - type: web
    name: onlypain-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CLIENT_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PLUS_MONTHLY
        sync: false
      - key: ADMIN_EMAILS
        sync: false

  - type: web
    name: onlypain-web
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: API_PROXY_URL
        fromService:
          type: web
          name: onlypain-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_SOCKET_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
